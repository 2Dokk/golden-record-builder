# 소스 시스템 → 공통 스키마 매핑과 필드별 병합 규칙.
# 새 소스를 붙일 때는 코드 수정 없이 [[sources]] 블록만 추가하면 된다.
#
# 공통 스키마: biz_no, company_name, contact_person, phone, address, as_of
#   as_of = 해당 소스 레코드의 기준일 (충돌 시 "최신값" 판단에 사용)

[match]
key = "biz_no"   # 정규화된 사업자등록번호(숫자 10자리)로 동일 거래처 판별

# 필드별 병합(survivorship) 규칙
#   compare     : 값이 "같은지" 비교하는 방식 (exact | company_name | phone)
#   on_conflict : 정규화 후에도 값이 다를 때 처리 (latest | manual_review)
#                 latest 라도 기준일이 같으면 판단 근거가 없으므로 수동 검토로 넘긴다.
[fields.company_name]
compare = "company_name"   # (주)/㈜/주식회사, 공백 등 법인 표기 차이는 같은 값으로 본다
on_conflict = "manual_review"   # 상호는 자동으로 덮어쓰지 않는다

[fields.contact_person]
compare = "exact"
on_conflict = "latest"

[fields.phone]
compare = "phone"
on_conflict = "latest"

[fields.address]
compare = "exact"
on_conflict = "latest"

[[sources]]
id = "A"
name = "영업시스템"
path = "data/raw/system_a_sales.csv"
format = "csv"
priority = 1   # 기준일이 같을 때 잠정값을 어느 소스에서 가져올지 (작을수록 우선)
[sources.columns]
"회사명" = "company_name"
"사업자등록번호" = "biz_no"
"담당자" = "contact_person"
"전화번호" = "phone"
"최종수정일" = "as_of"

[[sources]]
id = "B"
name = "회계시스템"
path = "data/raw/system_b_accounting.json"
format = "json"
records_path = "거래처"   # JSON 안에서 레코드 배열이 있는 키
priority = 2
[sources.columns]
"거래처명" = "company_name"
"사업자번호" = "biz_no"
"주소" = "address"
"대표전화" = "phone"
"등록일" = "as_of"   # 회계시스템엔 수정일이 없어 등록일을 기준일로 사용 (README '한계' 참고)
